<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f5">
<title>GYM – Clean Start</title>
<style>
html,body{margin:0;min-height:100%;background:#f6f7f5;color:#171b18;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{display:grid;place-items:center;padding:24px;box-sizing:border-box}.box{text-align:center}.box strong{display:block;font-size:20px;margin-bottom:8px}.box span{color:#6f7771;font-size:15px}
</style>
</head>
<body>
<div class="box"><strong>Aktuelle Trainingsversion wird geladen …</strong><span>Cache wird vollständig umgangen.</span></div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){console.warn('Clean start:',e)}
  const fresh=`${Date.now()}-${Math.random().toString(36).slice(2)}`;
  location.replace(`./index.html?clean=${encodeURIComponent(fresh)}`);
})();
</script>
</body>
</html>
