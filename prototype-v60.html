<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
<title>GYM Prototype V60</title>
<style>
:root{--bg:#f1f4f0;--card:#fff;--soft:#f6f8f5;--line:#dbe3dc;--text:#162019;--muted:#6b766e;--green:#356b4d;--green2:#244f38;--pale:#e4efe7;--red:#9a4d45;--shadow:0 10px 30px rgba(34,66,45,.07)}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.app{min-height:100dvh;padding-bottom:84px}.top{position:sticky;top:0;z-index:40;display:grid;grid-template-columns:44px minmax(0,1fr) 92px;align-items:center;gap:10px;padding:calc(9px + env(safe-area-inset-top)) 13px 9px;background:rgba(250,252,249,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}.close{width:44px;height:44px;border:1px solid var(--line);border-radius:15px;background:#fff;font-size:1.35rem}.top small{display:block;color:var(--muted);font-size:.62rem;letter-spacing:.12em}.top strong{font-size:1.03rem}.timer{height:44px;border:1px solid var(--line);border-radius:15px;background:#fff;color:var(--green2);font-weight:800}.exercise-tabs{position:sticky;top:63px;z-index:35;display:flex;gap:7px;overflow-x:auto;padding:10px 12px;background:rgba(241,244,240,.96);scrollbar-width:none}.exercise-tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 min(78vw,290px);display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left}.tab b{display:grid;place-items:center;flex:0 0 27px;height:27px;border-radius:9px;background:var(--soft);font-size:.72rem}.tab span{font-size:.76rem;font-weight:750;line-height:1.2;white-space:normal}.tab.active{border-color:var(--green);background:var(--pale)}.tab.active b{background:var(--green);color:#fff}.viewport{overflow:hidden}.track{display:flex;align-items:flex-start;transition:transform .28s cubic-bezier(.2,.8,.2,1);touch-action:pan-y}.page{flex:0 0 100%;width:100%;padding:4px 13px 22px}.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;margin:4px 0 10px}.eyebrow{color:var(--green);font-size:.65rem;font-weight:850;letter-spacing:.11em}.hero h1{margin:4px 0 5px;font-size:1.38rem;line-height:1.13}.hero p{margin:0;color:var(--muted);font-size:.77rem}.hero-actions{display:flex;gap:6px}.circle{width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:#fff}.card{margin-top:10px;padding:13px;border:1px solid var(--line);border-radius:21px;background:var(--card);box-shadow:var(--shadow)}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.card-head small{color:var(--green);font-weight:850;letter-spacing:.09em}.card-head button{border:0;border-radius:11px;background:var(--soft);padding:8px 10px}.device-current{display:grid;grid-template-columns:105px minmax(0,1fr);gap:11px}.device-current img{width:105px;height:105px;object-fit:contain;border-radius:16px;background:var(--soft)}.device-current h2{margin:2px 0 5px;font-size:1.03rem;line-height:1.15}.device-current dl{display:grid;grid-template-columns:auto 1fr;gap:3px 7px;margin:7px 0 0;font-size:.72rem}.device-current dt{color:var(--muted)}.device-current dd{margin:0;font-weight:750}.variant-strip{display:flex;gap:8px;overflow-x:auto;margin:11px -2px 0;padding:2px 2px 7px;scrollbar-width:none;scroll-snap-type:x proximity;touch-action:pan-x}.variant-strip::-webkit-scrollbar{display:none}.variant{flex:0 0 175px;display:grid;grid-template-columns:54px 1fr;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:15px;background:var(--soft);text-align:left;scroll-snap-align:start}.variant img{width:54px;height:54px;object-fit:contain;border-radius:11px;background:#fff}.variant strong{display:block;font-size:.72rem;line-height:1.18}.variant span{display:block;margin-top:4px;color:var(--muted);font-size:.64rem}.variant.active{border-color:var(--green);background:var(--pale)}.variant.missing{opacity:.46}.coach-main{padding:13px;border-radius:17px;background:linear-gradient(135deg,#edf5ef,#fafcf9)}.coach-main .topline{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.7rem}.coach-main h2{margin:8px 0 4px;font-size:1.23rem}.coach-main p{margin:0;color:var(--muted);font-size:.78rem;line-height:1.42}.coach-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.coach-stats article{padding:9px;border-radius:14px;background:var(--soft)}.coach-stats small{display:block;color:var(--muted);font-size:.59rem}.coach-stats strong{font-size:.79rem}.spark{height:74px;margin-top:10px;border-radius:15px;background:var(--soft);padding:6px}.spark svg{width:100%;height:100%}.sets{display:grid;gap:8px}.set{display:grid;grid-template-columns:31px minmax(0,1fr) minmax(0,1fr) minmax(0,.8fr) 38px;gap:6px;align-items:end}.set-no{display:grid;place-items:center;height:48px;border-radius:13px;background:var(--pale);font-weight:850}.field label{display:block;margin:0 0 3px 4px;color:var(--muted);font-size:.59rem}.field input{width:100%;height:48px;border:1px solid var(--line);border-radius:13px;background:#fbfcfb;text-align:center;font-size:16px}.warm{height:48px;border:1px solid var(--line);border-radius:13px;background:#fbfcfb;font-size:.63rem;font-weight:850}.set-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.set-actions button,.wide-actions button{min-height:44px;border:1px solid var(--line);border-radius:14px;background:#fff;font-weight:750}.warmup{display:flex;align-items:center;gap:8px;margin-top:10px;padding:10px;border-radius:15px;background:var(--soft);font-size:.75rem;color:var(--muted)}.warmup .sep{width:1px;height:18px;background:#bfc9c1}.warmup button{margin-left:auto;border:0;background:none;color:var(--green);font-weight:750}.wide-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:10px}.bottom{position:fixed;z-index:45;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:8px 13px calc(8px + env(safe-area-inset-bottom));background:rgba(250,252,249,.96);backdrop-filter:blur(20px);border-top:1px solid var(--line)}.bottom button{min-height:49px;border:1px solid var(--line);border-radius:15px;background:#fff;font-weight:850}.bottom .overview-btn{width:52px}.bottom .next{background:var(--green);border-color:var(--green);color:#fff}.sheet{position:fixed;z-index:100;inset:0;display:none;align-items:flex-end;background:rgba(15,25,17,.42)}.sheet.open{display:flex}.sheet-card{width:100%;max-height:86dvh;overflow:auto;padding:15px 13px calc(18px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;background:#fff}.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet-head h2{margin:0}.sheet-head button{border:0;border-radius:12px;background:var(--soft);padding:9px 11px}.sheet-copy{margin-top:13px;color:var(--muted);font-size:.84rem;line-height:1.5}.sheet-copy strong{color:var(--text)}.order-list{display:grid;gap:8px;margin-top:13px}.order-item{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:16px;background:var(--soft)}.order-item b{display:grid;place-items:center;height:34px;border-radius:10px;background:var(--pale)}.order-item strong{font-size:.82rem}.order-tools{display:flex;gap:5px}.order-tools button{width:37px;height:37px;border:1px solid var(--line);border-radius:11px;background:#fff}.add{width:100%;min-height:48px;margin-top:12px;border:1px dashed var(--green);border-radius:15px;background:#f7faf7;color:var(--green2);font-weight:850}@media(min-width:700px){.app{max-width:470px;margin:auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}.bottom{left:50%;right:auto;width:470px;transform:translateX(-50%)}}
</style>
</head>
<body>
<div class="app">
<header class="top"><button class="close">×</button><div><small>TRAINING HEUTE</small><strong>Training B</strong></div><button class="timer" id="timer">00:00</button></header>
<nav class="exercise-tabs" id="tabs"></nav>
<div class="viewport" id="viewport"><div class="track" id="track"></div></div>
<nav class="bottom"><button id="prev">‹ Vorherige</button><button class="overview-btn" id="open-order">☷</button><button class="next" id="next">Nächste ›</button></nav>
</div>
<div class="sheet" id="sheet"><div class="sheet-card"><div class="sheet-head"><h2 id="sheet-title">Übungsreihenfolge</h2><button id="close-sheet">Schließen</button></div><div id="sheet-content"></div></div></div>
<script>
const exercises=[
{name:'Kurzhantel-Schrägbankdrücken',target:'2–3 Arbeitssätze · 6–12 Wdh. · RIR 0–2',recommended:'2–3',selected:0,sets:[[55,9,0],[55,9,1],[55,8,1]],coach:{title:'55 kg beibehalten',text:'Ziel heute: 9–10 saubere Wiederholungen. Arbeite dich mit 55 kg schrittweise bis 12 vor; erst dann Gewicht erhöhen.',pr:'55 × 9 · RIR 0',last:'55 × 9 · RIR 0',next:'55 × 10'},devices:[['Kurzhantel-Schrägbankdrücken','IMG_3071.png','55 × 9 · RIR 0','03.08.','B12',true],['Schrägbankdrückmaschine Dual','IMG_3062.png','–','–','–',true],['Schrägbankmaschine sitzend','IMG_3063.png','–','–','–',false]]},
{name:'Latzugstation mit Oberschenkelpolster',target:'2–3 Arbeitssätze · 8–12 Wdh. · RIR 0–2',recommended:'2–3',selected:0,sets:[[65,9,0],[65,9,1],[65,8,1]],coach:{title:'65 kg beibehalten',text:'Ziel heute: mindestens 9 saubere Wiederholungen. Sobald 12 kontrollierte Wiederholungen erreicht sind, folgt der nächste Gewichtsschritt.',pr:'65 × 9 · RIR 0',last:'65 × 9 · RIR 0',next:'65 × 10'},devices:[['Latzugstation mit Oberschenkelpolster','IMG_3047.png','65 × 9 · RIR 0','03.08.','B05',true],['Rückenzugmaschine Dual','IMG_3048.png','–','–','–',false],['High Row Dual','IMG_3049.png','–','–','–',true]]},
{name:'Butterfly reverse mit Griffen',target:'2 Arbeitssätze · 10–15 Wdh. · RIR 1–2',recommended:'2',selected:0,sets:[[50,10,1],[50,10,1]],coach:{title:'50 kg · Ziel 11–12',text:'Bleib bei 50 kg und erhöhe zunächst die sauberen Wiederholungen. Kein Gewichtssprung, bevor der obere Zielbereich stabil erreicht wird.',pr:'50 × 10 · RIR 1',last:'50 × 10 · RIR 1',next:'50 × 11'},devices:[['Butterfly reverse mit Griffen','IMG_3050.png','50 × 10 · RIR 1','03.08.','C03',true],['Butterfly reverse mit Pads','IMG_3051.png','–','–','–',true]]},
{name:'Seithebemaschine ohne Armpolster',target:'3 Arbeitssätze · 10–15 Wdh. · RIR 1–2',recommended:'3',selected:0,sets:[[25,12,2],[25,11,1],[25,10,1]],coach:{title:'25 kg beibehalten',text:'Ziel heute: Satz für Satz den Wiederholungsbereich stabilisieren. Schulter kontrolliert belasten, nicht bis zum technischen Zerfall.',pr:'25 × 12 · RIR 2',last:'25 × 12 · RIR 2',next:'25 × 13'},devices:[['Seithebemaschine ohne Armpolster','IMG_3064.png','25 × 12 · RIR 2','03.08.','D08',true],['Seithebemaschine Dual','IMG_3065.png','–','–','–',false],['Kurzhantel-Seitheben','IMG_3069.png','–','–','–',true]]}
];
let current=0,startX=0,seconds=0,running=false,swipeBlocked=false;
const $=s=>document.querySelector(s);
function setInputs(e,pi){return e.sets.map((s,i)=>`<div class="set"><span class="set-no">${i+1}</span><div class="field"><label>kg</label><input data-page="${pi}" data-set="${i}" data-field="0" inputmode="decimal" value="${s[0]}"></div><div class="field"><label>Wdh.</label><input data-page="${pi}" data-set="${i}" data-field="1" inputmode="numeric" value="${s[1]}"></div><div class="field"><label>RIR</label><input data-page="${pi}" data-set="${i}" data-field="2" inputmode="numeric" value="${s[2]}"></div><button class="warm">W</button></div>`).join('')}
function variants(e,pi){return e.devices.map((d,i)=>`<button class="variant ${i===e.selected?'active':''} ${d[5]?'':'missing'}" data-page="${pi}" data-device="${i}"><img src="${d[1]}" alt=""><span><strong>${d[0]}</strong><span>${d[5]?`PR ${d[2]} · ${d[3]}`:'Nicht im Studio'}</span></span></button>`).join('')}
function page(e,i){const d=e.devices[e.selected];return `<section class="page" data-page="${i}"><header class="hero"><div><span class="eyebrow">ÜBUNG ${i+1} VON ${exercises.length}</span><h1>${e.name}</h1><p>${e.target}</p></div><div class="hero-actions"><button class="circle" data-info="${i}" title="Info">i</button><button class="circle" data-order-open title="Sortieren">↕</button></div></header><section class="card"><div class="card-head"><small>GERÄT & ALTERNATIVEN</small><button data-device-history="${i}">Verlauf</button></div><div class="device-current"><img src="${d[1]}" alt=""><div><span class="eyebrow">AKTIV</span><h2>${d[0]}</h2><dl><dt>PR</dt><dd>${d[2]}</dd><dt>Zuletzt</dt><dd>${d[3]}</dd><dt>Studio-Code</dt><dd>${d[4]}</dd></dl></div></div><div class="variant-strip">${variants(e,i)}</div></section><section class="card"><div class="card-head"><small>COACH · PROGRESSIVE OVERLOAD</small><button data-coach-details="${i}">Details</button></div><div class="coach-main"><div class="topline"><span>Heutige Vorgabe</span><span>Basis: höchster relevanter Satz</span></div><h2>${e.coach.title}</h2><p>${e.coach.text}</p></div><div class="coach-stats"><article><small>PERSONAL RECORD</small><strong>${e.coach.pr}</strong></article><article><small>LETZTES MAL</small><strong>${e.coach.last}</strong></article><article><small>NÄCHSTES ZIEL</small><strong>${e.coach.next}</strong></article></div><div class="spark"><svg viewBox="0 0 320 70"><line x1="6" y1="58" x2="314" y2="58" stroke="#d5ded7"/><line x1="6" y1="10" x2="6" y2="58" stroke="#d5ded7"/><polyline fill="none" stroke="#356b4d" stroke-width="4" points="8,53 80,47 152,38 224,31 310,17"/><circle cx="310" cy="17" r="5" fill="#356b4d"/></svg></div></section><section class="card"><div class="card-head"><small>ARBEITSSÄTZE · EMPFOHLEN ${e.recommended}</small><button data-set-history="${i}">Verlauf</button></div><div class="sets">${setInputs(e,i)}</div><div class="set-actions"><button data-remove-set="${i}">− Satz</button><button data-add-set="${i}">+ Satz</button></div><div class="warmup"><span>30 kg × 12</span><i class="sep"></i><span>40 kg × 8</span><button data-warmup="${i}">Warm-up ändern</button></div><div class="wide-actions"><button data-info="${i}">Info</button><button data-order-open>Sortieren</button><button data-add-extra>+ Übung</button></div></section></section>`}
function render(){
 $('#tabs').innerHTML=exercises.map((e,i)=>`<button class="tab ${i===current?'active':''}" data-tab="${i}"><b>${i+1}</b><span>${e.name}</span></button>`).join('');
 $('#track').innerHTML=exercises.map(page).join('');
 $('#track').style.transform=`translateX(-${current*100}%)`;
 document.querySelector(`[data-tab="${current}"]`)?.scrollIntoView({inline:'center',block:'nearest'});
 bind();
}
function openSheet(title,html){$('#sheet-title').textContent=title;$('#sheet-content').innerHTML=html;$('#sheet').classList.add('open')}
function bind(){
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(+b.dataset.tab));
 document.querySelectorAll('[data-device]').forEach(b=>b.onclick=()=>{const p=+b.dataset.page;exercises[p].selected=+b.dataset.device;current=p;render()});
 document.querySelectorAll('[data-add-set]').forEach(b=>b.onclick=()=>{const e=exercises[+b.dataset.addSet];const last=e.sets.at(-1)||[0,0,0];e.sets.push([...last]);render()});
 document.querySelectorAll('[data-remove-set]').forEach(b=>b.onclick=()=>{const e=exercises[+b.dataset.removeSet];if(e.sets.length>1)e.sets.pop();render()});
 document.querySelectorAll('input[data-page]').forEach(input=>input.oninput=()=>{exercises[+input.dataset.page].sets[+input.dataset.set][+input.dataset.field]=input.value});
 document.querySelectorAll('[data-order-open]').forEach(b=>b.onclick=openOrder);
 document.querySelectorAll('[data-add-extra]').forEach(b=>b.onclick=()=>openSheet('Übung hinzufügen','<div class="sheet-copy"><strong>Später:</strong> vollständiger Übungskatalog mit Bauch-, Arm- und Ersatzübungen. Die ergänzte Übung wird für diesen Trainingstag eingefügt und kann anschließend sortiert werden.</div>'));
 document.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>openSheet('Übungsausführung',`<div class="sheet-copy"><strong>${exercises[+b.dataset.info].name}</strong><br>Hier erscheinen später Ausführung, Sitz-/Bankposition, Griff, Bewegungsweg und persönliche Geräteeinstellung.</div>`));
 document.querySelectorAll('[data-coach-details]').forEach(b=>b.onclick=()=>{const e=exercises[+b.dataset.coachDetails];openSheet('Coach-Details',`<div class="sheet-copy"><strong>Progressionsbasis:</strong> ${e.coach.pr}<br><br>${e.coach.text}<br><br>Leichtere Einstiegs- und Warm-up-Sätze werden nicht als Progressionsbasis gewertet.</div>`)});
 document.querySelectorAll('[data-device-history]').forEach(b=>b.onclick=()=>{const e=exercises[+b.dataset.deviceHistory],d=e.devices[e.selected];openSheet('Geräteverlauf',`<div class="sheet-copy"><strong>${d[0]}</strong><br>03.08. · ${d[2]}<br>Vorherige Einheiten und ein gerätespezifischer Verlauf erscheinen später hier.</div>`)});
 document.querySelectorAll('[data-set-history]').forEach(b=>b.onclick=()=>{const e=exercises[+b.dataset.setHistory];openSheet('Satzverlauf',`<div class="sheet-copy">${e.sets.map((s,i)=>`<strong>Satz ${i+1}:</strong> ${s[0]} kg × ${s[1]} · RIR ${s[2]}`).join('<br>')}</div>`)});
 document.querySelectorAll('[data-warmup]').forEach(b=>b.onclick=()=>openSheet('Warm-up-Historie','<div class="sheet-copy"><strong>Zuletzt:</strong><br>30 kg × 12<br>40 kg × 8<br><br>Warm-up bleibt separat von der Progressionsauswertung.</div>'));
}
function go(i){current=(i+exercises.length)%exercises.length;render()}
$('#prev').onclick=()=>go(current-1);$('#next').onclick=()=>go(current+1);$('#open-order').onclick=openOrder;
$('#viewport').addEventListener('touchstart',e=>{startX=e.touches[0].clientX;swipeBlocked=Boolean(e.target.closest('.variant-strip,input,button,.sheet'))},{passive:true});
$('#viewport').addEventListener('touchend',e=>{if(swipeBlocked){swipeBlocked=false;return}const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>70)go(current+(dx<0?1:-1))},{passive:true});
function openOrder(){renderOrder();$('#sheet-title').textContent='Übungsreihenfolge';$('#sheet').classList.add('open')}
function renderOrder(){$('#sheet-content').innerHTML=`<div class="order-list">${exercises.map((e,i)=>`<div class="order-item"><b>${i+1}</b><strong>${e.name}</strong><div class="order-tools"><button data-up="${i}">↑</button><button data-down="${i}">↓</button></div></div>`).join('')}</div><button class="add" id="add-exercise">+ Übung für heute hinzufügen</button>`;document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>move(+b.dataset.up,-1));document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>move(+b.dataset.down,1));$('#add-exercise').onclick=()=>openSheet('Übung hinzufügen','<div class="sheet-copy">Hier öffnet später der vollständige Übungskatalog inklusive Bauch-, Arm- und Ersatzübungen.</div>')}
function move(i,d){const j=i+d;if(j<0||j>=exercises.length)return;[exercises[i],exercises[j]]=[exercises[j],exercises[i]];current=j;renderOrder();render()}
$('#close-sheet').onclick=()=>$('#sheet').classList.remove('open');$('#sheet').onclick=e=>{if(e.target===$('#sheet'))$('#sheet').classList.remove('open')};
$('#timer').onclick=()=>{running=!running;$('#timer').style.background=running?'#e4efe7':'#fff'};setInterval(()=>{if(!running)return;seconds++;$('#timer').textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`},1000);
render();
</script>
</body>
</html>
