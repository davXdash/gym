<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes"><title>GYM Prototype V61</title><style>:root{--bg:#f2f5f1;--card:#fff;--soft:#f6f8f5;--line:#d9e2da;--text:#172019;--muted:#6d776f;--green:#356b4d;--green2:#244f38;--pale:#e3eee6;--amber:#f2e8cc;--done:#dceee2;--shadow:0 10px 28px rgba(31,61,42,.07)}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}button,input{font:inherit}.app{min-height:100dvh;padding-bottom:86px}.top{position:sticky;top:0;z-index:40;display:grid;grid-template-columns:44px 1fr 92px;gap:10px;align-items:center;padding:calc(9px + env(safe-area-inset-top)) 13px 9px;background:rgba(250,252,249,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}.close,.timer{height:44px;border:1px solid var(--line);border-radius:15px;background:#fff}.close{width:44px;font-size:1.3rem}.top small{display:block;color:var(--muted);font-size:.61rem;letter-spacing:.12em}.top strong{font-size:1.02rem}.timer{font-weight:800;color:var(--green2)}.tabs{position:sticky;top:63px;z-index:35;display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:rgba(242,245,241,.97);scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:center;min-width:180px;max-width:240px;padding:9px 11px;border:1px solid var(--line);border-radius:15px;background:#fff;text-align:left}.tab b{display:grid;place-items:center;width:28px;height:28px;border-radius:10px;background:var(--soft)}.tab span{white-space:normal;font-size:.76rem;font-weight:800;line-height:1.16}.tab.active{border-color:var(--green);background:var(--pale)}.tab.started:not(.active){background:var(--amber)}.tab.done:not(.active){background:var(--done)}.viewport{overflow:hidden}.track{display:flex;transition:transform .25s ease}.page{flex:0 0 100%;padding:6px 13px 24px}.hero{display:flex;justify-content:space-between;gap:12px;margin:6px 0 10px}.eyebrow{color:var(--green);font-size:.64rem;font-weight:900;letter-spacing:.1em}.hero h1{margin:4px 0 4px;font-size:1.35rem;line-height:1.13}.hero p{margin:0;color:var(--muted);font-size:.76rem}.card{margin-top:10px;padding:13px;border:1px solid var(--line);border-radius:21px;background:#fff;box-shadow:var(--shadow)}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.card-head small{color:var(--green);font-weight:900;letter-spacing:.09em}.card-head button{border:0;border-radius:11px;background:var(--soft);padding:8px 10px}.device-main{display:grid;grid-template-columns:110px 1fr;gap:12px}.device-main img{width:110px;height:110px;object-fit:contain;border-radius:16px;background:var(--soft)}.device-main h2{margin:3px 0 6px;font-size:1rem}.device-main dl{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;margin:0;font-size:.72rem}.device-main dt{color:var(--muted)}.device-main dd{margin:0;font-weight:800}.variants{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:3px;scrollbar-width:none;touch-action:pan-x}.variants::-webkit-scrollbar{display:none}.variant{flex:0 0 190px;display:grid;grid-template-columns:58px 1fr;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:15px;background:var(--soft);text-align:left}.variant img{width:58px;height:58px;object-fit:contain;border-radius:12px;background:#fff}.variant strong{display:block;font-size:.74rem;line-height:1.2}.variant span{display:block;margin-top:4px;color:var(--muted);font-size:.64rem}.variant.active{border-color:var(--green);background:var(--pale)}.variant.missing{opacity:.62}.coachbox{padding:13px;border-radius:17px;background:linear-gradient(135deg,#edf5ef,#fafcf9)}.coachbox h2{margin:8px 0 4px;font-size:1.2rem}.coachbox p{margin:0;color:var(--muted);font-size:.79rem;line-height:1.42}.coachstats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.coachstats article{padding:9px;border-radius:14px;background:var(--soft)}.coachstats small{display:block;color:var(--muted);font-size:.58rem}.coachstats strong{font-size:.78rem}.chart{margin-top:11px;padding:8px;border-radius:15px;background:var(--soft)}.chart svg{width:100%;height:120px}.axis{font-size:9px;fill:#7a867d}.sets{display:grid;gap:8px}.set{display:grid;grid-template-columns:30px 1fr 1fr .78fr 42px;gap:6px;align-items:end}.setno{display:grid;place-items:center;height:48px;border-radius:13px;background:var(--pale);font-weight:900}.field label{display:block;margin:0 0 3px 4px;color:var(--muted);font-size:.58rem}.field input{width:100%;height:48px;border:1px solid var(--line);border-radius:13px;background:#fbfcfb;text-align:center;font-size:16px}.apply{height:48px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--green2);font-weight:900}.suggest{grid-column:2/-1;margin-top:-2px;color:var(--muted);font-size:.67rem}.set-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.set-actions button,.wide button{min-height:44px;border:1px solid var(--line);border-radius:14px;background:#fff;font-weight:800}.warmup{margin-top:10px;padding:10px;border-radius:15px;background:var(--soft);font-size:.75rem;color:var(--muted)}.wide{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.complete{width:100%;min-height:48px;margin-top:10px;border:0;border-radius:15px;background:var(--green);color:#fff;font-weight:900}.bottom{position:fixed;z-index:45;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:8px 13px calc(8px + env(safe-area-inset-bottom));background:rgba(250,252,249,.96);backdrop-filter:blur(20px);border-top:1px solid var(--line)}.bottom button{min-height:49px;border:1px solid var(--line);border-radius:15px;background:#fff;font-weight:900}.bottom .mid{width:52px}.bottom .next{background:var(--green);border-color:var(--green);color:#fff}.sheet{position:fixed;z-index:100;inset:0;display:none;align-items:flex-end;background:rgba(15,25,17,.42)}.sheet.open{display:flex}.sheet-card{width:100%;max-height:86dvh;overflow:auto;padding:15px 13px calc(18px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;background:#fff}.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet-head h2{margin:0}.sheet-head button{border:0;border-radius:12px;background:var(--soft);padding:9px 11px}.sheet-body{display:grid;gap:10px;margin-top:14px}.order{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:16px;background:var(--soft)}.order b{display:grid;place-items:center;height:34px;border-radius:10px;background:var(--pale)}.order button{width:36px;height:36px;border:1px solid var(--line);border-radius:11px;background:#fff}.warm-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.warm-row input{height:44px;border:1px solid var(--line);border-radius:12px;text-align:center}.warm-row button{border:0;border-radius:12px;background:#f3e7e5}.lightbox{position:fixed;z-index:120;inset:0;display:none;place-items:center;background:rgba(8,12,9,.86);padding:20px}.lightbox.open{display:grid}.lightbox img{max-width:94vw;max-height:82vh;border-radius:20px;background:#fff}.lightbox button{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;width:44px;height:44px;border:0;border-radius:14px;background:#fff;font-size:1.4rem}@media(min-width:700px){.app{max-width:470px;margin:auto}.bottom{left:50%;right:auto;width:470px;transform:translateX(-50%)}}</style></head><body><div class="app"><header class="top"><button class="close">×</button><div><small>TRAINING HEUTE</small><strong>Training B</strong></div><button class="timer" id="timer">00:00</button></header><nav class="tabs" id="tabs"></nav><div class="viewport" id="viewport"><div class="track" id="track"></div></div><nav class="bottom"><button id="prev">‹ Vorherige</button><button class="mid" id="order">☷</button><button class="next" id="next">Nächste ›</button></nav></div><div class="sheet" id="sheet"><div class="sheet-card"><div class="sheet-head"><h2 id="sheetTitle">Übersicht</h2><button id="sheetClose">Schließen</button></div><div class="sheet-body" id="sheetBody"></div></div></div><div class="lightbox" id="lightbox"><button id="lightClose">×</button><img id="lightImage" alt=""></div><script>const exercises=[{name:'Kurzhantel-Schrägbankdrücken',target:'2–3 Arbeitssätze · 6–12 Wdh. · RIR 1–2',status:'open',selected:0,devices:[{name:'Kurzhantel-Schrägbankdrücken',img:'IMG_3071.png',present:true,code:'B12',history:[[50,12,4,'29.07.'],[55,8,1,'01.08.'],[55,9,0,'03.08.']],warm:[[30,12],[40,8]]},{name:'Schrägbankdrückmaschine Dual',img:'IMG_3062.png',present:true,code:'B14',history:[[45,10,2,'02.08.']],warm:[[25,12],[35,8]]},{name:'Schrägbankmaschine sitzend',img:'IMG_3063.png',present:false,code:'–',history:[],warm:[]}]},{name:'Latzugstation mit Oberschenkelpolster',target:'3 Arbeitssätze · 8–12 Wdh. · RIR 1–2',status:'open',selected:0,devices:[{name:'Latzugstation mit Oberschenkelpolster',img:'IMG_3047.png',present:true,code:'B05',history:[[60,12,2,'29.07.'],[65,9,1,'03.08.']],warm:[[35,12],[50,8]]},{name:'Rückenzugmaschine Dual',img:'IMG_3048.png',present:false,code:'–',history:[],warm:[]},{name:'High Row Dual',img:'IMG_3049.png',present:true,code:'B07',history:[[55,10,2,'31.07.']],warm:[[35,10]]}]},{name:'Butterfly reverse mit Griffen',target:'2 Arbeitssätze · 10–15 Wdh. · RIR 1–2',status:'open',selected:0,devices:[{name:'Butterfly reverse mit Griffen',img:'IMG_3050.png',present:true,code:'C03',history:[[45,12,2,'31.07.'],[50,10,1,'03.08.']],warm:[[30,12]]},{name:'Butterfly reverse mit Pads',img:'IMG_3051.png',present:true,code:'C04',history:[[40,13,2,'30.07.']],warm:[[25,12]]}]}];let current=0,startX=0,seconds=0,running=false;const $=s=>document.querySelector(s);function topSet(d){return d.history.length?d.history.reduce((a,b)=>b[0]>a[0]||b[0]===a[0]&&b[1]>a[1]?b:a):null}function last(d){return d.history.at(-1)||null}function coach(d){const l=last(d);if(!l)return{title:'Neue Gerätereferenz setzen',text:'Für dieses konkrete Gerät gibt es noch keine belastbare Progressionsbasis.',next:'–'};const [kg,reps,rir]=l;let target=reps;let text;if(rir>=3){text=`${kg} kg waren zu leicht. Erhöhe das Gewicht kontrolliert und bleibe im Zielbereich.`;target=Math.max(6,reps-2)}else if(rir===0){text=`${kg} kg beibehalten. Wiederhole mindestens ${reps} saubere Wiederholungen und arbeite dich schrittweise bis 12 vor.`}else{target=Math.min(12,reps+1);text=`${kg} kg beibehalten. Ziel heute: ${target} saubere Wiederholungen bei etwa RIR 1–2.`}return{title:`${kg} kg · Ziel ${target}`,text,next:`${kg} × ${target}`}}function suggestedSets(d,count){const l=last(d);if(!l)return Array.from({length:count},()=>['','','']);const c=coach(d),target=Number(c.next.split('×')[1])||l[1];return Array.from({length:count},(_,i)=>i===0?[l[0],l[1],l[2]]:[l[0],Math.max(1,target-(i-1)),i===1?1:2])}function chart(d){if(!d.history.length)return'<p style="color:#6d776f">Noch kein Verlauf an diesem Gerät.</p>';const vals=d.history,kg=vals.map(v=>v[0]),min=Math.min(...kg)-5,max=Math.max(...kg)+5,pts=vals.map((v,i)=>`${42+i*(240/Math.max(1,vals.length-1))},${92-(v[0]-min)/(max-min)*68}`).join(' ');return`<svg viewBox="0 0 310 125"><line x1="40" y1="12" x2="40" y2="96" stroke="#b8c4ba"/><line x1="40" y1="96" x2="292" y2="96" stroke="#b8c4ba"/><text x="4" y="18" class="axis">${max} kg</text><text x="8" y="96" class="axis">${min} kg</text>${vals.map((v,i)=>`<text x="${32+i*(240/Math.max(1,vals.length-1))}" y="116" class="axis">${v[3]}</text>`).join('')}<polyline fill="none" stroke="#356b4d" stroke-width="4" points="${pts}"/>${vals.map((v,i)=>`<circle cx="${42+i*(240/Math.max(1,vals.length-1))}" cy="${92-(v[0]-min)/(max-min)*68}" r="4" fill="#356b4d"/>`).join('')}<text x="4" y="62" class="axis" transform="rotate(-90 12 62)">Arbeitsgewicht</text><text x="150" y="124" class="axis">Trainingstag</text></svg>`}function page(e,ei){const d=e.devices[e.selected],pr=topSet(d),l=last(d),c=coach(d),rows=suggestedSets(d,Math.max(2,Number(e.target.match(/\d+/)?.[0])||2));return`<section class="page"><header class="hero"><div><span class="eyebrow">ÜBUNG ${ei+1} VON ${exercises.length}</span><h1>${e.name}</h1><p>${e.target}</p></div></header><section class="card"><div class="card-head"><small>GERÄT & ALTERNATIVEN</small><button data-device-history="${ei}">Verlauf</button></div><div class="device-main"><img src="${d.img}" data-zoom="${d.img}" alt=""><div><span class="eyebrow">AKTIV</span><h2>${d.name}</h2><dl><dt>PR</dt><dd>${pr?`${pr[0]} × ${pr[1]} · RIR ${pr[2]}`:'–'}</dd><dt>Zuletzt</dt><dd>${l?`${l[0]} × ${l[1]} · RIR ${l[2]} · ${l[3]}`:'–'}</dd><dt>Studio-Code</dt><dd>${d.code}</dd></dl></div></div><div class="variants">${e.devices.map((v,i)=>`<button class="variant ${i===e.selected?'active':''} ${v.present?'':'missing'}" data-device="${ei}:${i}"><img src="${v.img}" alt=""><span><strong>${v.name}</strong><span>${v.present?(last(v)?`Zuletzt ${last(v)[0]} × ${last(v)[1]} · RIR ${last(v)[2]}`:'Noch keine Werte'):'Nicht im Studio'}</span></span></button>`).join('')}</div></section><section class="card"><div class="card-head"><small>COACH · GERÄTESPEZIFISCH</small><button data-coach="${ei}">Details</button></div><div class="coachbox"><span class="eyebrow">GESAMTZIEL + PROGRESSION AN DIESEM GERÄT</span><h2>${c.title}</h2><p>${c.text}</p></div><div class="coachstats"><article><small>PR</small><strong>${pr?`${pr[0]} × ${pr[1]} · RIR ${pr[2]}`:'–'}</strong></article><article><small>LETZTES MAL</small><strong>${l?`${l[0]} × ${l[1]}`:'–'}</strong></article><article><small>NÄCHSTES ZIEL</small><strong>${c.next}</strong></article></div><div class="chart">${chart(d)}</div></section><section class="card"><div class="card-head"><small>ARBEITSSÄTZE</small><button data-set-history="${ei}">Verlauf</button></div><div class="sets">${rows.map((r,i)=>`<div class="set"><span class="setno">${i+1}</span><div class="field"><label>kg</label><input data-input="${ei}" inputmode="decimal" value="${i===0?r[0]:''}" placeholder="${r[0]}"></div><div class="field"><label>Wdh.</label><input data-input="${ei}" inputmode="numeric" value="${i===0?r[1]:''}" placeholder="${r[1]}"></div><div class="field"><label>RIR</label><input data-input="${ei}" inputmode="numeric" value="${i===0?r[2]:''}" placeholder="${r[2]}"></div><button class="apply" data-apply="${ei}:${i}" title="Vorschlag übernehmen">↙</button><div class="suggest">Coach-Vorschlag: ${r[0]} kg · ${r[1]} Wdh. · RIR ${r[2]}</div></div>`).join('')}</div><div class="set-actions"><button data-remove="${ei}">− Satz</button><button data-add="${ei}">+ Satz</button></div><div class="warmup">Warm-up: ${d.warm.length?d.warm.map(w=>`${w[0]} kg × ${w[1]}`).join(' | '):'noch nicht gespeichert'} <button data-warm="${ei}" style="float:right;border:0;background:none;color:#356b4d;font-weight:800">ändern</button></div><div class="wide"><button data-info="${ei}">Info</button><button data-extra="${ei}">+ Übung</button></div><button class="complete" data-complete="${ei}">${e.status==='done'?'Übung abgeschlossen ✓':'Übung abschließen'}</button></section></section>`}function render(){tabs.innerHTML=exercises.map((e,i)=>`<button class="tab ${i===current?'active':''} ${e.status}" data-tab="${i}"><b>${e.status==='done'?'✓':i+1}</b><span>${e.name}</span></button>`).join('');track.innerHTML=exercises.map(page).join('');track.style.transform=`translateX(-${current*100}%)`;document.querySelector(`[data-tab="${current}"]`)?.scrollIntoView({inline:'center',block:'nearest'});bind()}function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(+b.dataset.tab));document.querySelectorAll('[data-device]').forEach(b=>b.onclick=e=>{e.stopPropagation();const[a,c]=b.dataset.device.split(':').map(Number);exercises[a].selected=c;current=a;render()});document.querySelectorAll('[data-zoom]').forEach(img=>img.onclick=()=>{lightImage.src=img.dataset.zoom;lightbox.classList.add('open')});document.querySelectorAll('[data-input]').forEach(i=>i.oninput=()=>{const e=exercises[+i.dataset.input];if(e.status==='open')e.status='started';renderTabsOnly()});document.querySelectorAll('[data-apply]').forEach(b=>b.onclick=()=>{const[a,si]=b.dataset.apply.split(':').map(Number),e=exercises[a],d=e.devices[e.selected],r=suggestedSets(d,Math.max(si+1,2))[si],set=b.closest('.set'),inputs=set.querySelectorAll('input');inputs.forEach((x,j)=>x.value=r[j]);if(e.status==='open')e.status='started';renderTabsOnly()});document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>{exercises[+b.dataset.complete].status='done';render()});document.querySelectorAll('[data-warm]').forEach(b=>b.onclick=()=>openWarm(+b.dataset.warm));document.querySelectorAll('[data-device-history],[data-set-history],[data-coach],[data-info],[data-extra]').forEach(b=>b.onclick=()=>openInfo(b));document.querySelectorAll('.variants').forEach(v=>{v.addEventListener('touchstart',ev=>ev.stopPropagation(),{passive:true});v.addEventListener('touchend',ev=>ev.stopPropagation(),{passive:true})})}function renderTabsOnly(){document.querySelectorAll('.tab').forEach((t,i)=>t.className=`tab ${i===current?'active':''} ${exercises[i].status}`)}function go(i){current=(i+exercises.length)%exercises.length;render()}prev.onclick=()=>go(current-1);next.onclick=()=>go(current+1);let gestureFromVariant=false;viewport.addEventListener('touchstart',e=>{gestureFromVariant=!!e.target.closest('.variants');startX=e.touches[0].clientX},{passive:true});viewport.addEventListener('touchend',e=>{if(gestureFromVariant)return;const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>75)go(current+(dx<0?1:-1))},{passive:true});function openSheet(title,html){sheetTitle.textContent=title;sheetBody.innerHTML=html;sheet.classList.add('open')}function openWarm(ei){const d=exercises[ei].devices[exercises[ei].selected];openSheet('Warm-up bearbeiten',`<div id="warmRows">${d.warm.map((w,i)=>`<div class="warm-row"><input value="${w[0]}" inputmode="decimal"><input value="${w[1]}" inputmode="numeric"><button data-delwarm="${i}">×</button></div>`).join('')}</div><button id="addWarm" class="complete" style="background:#fff;color:#244f38;border:1px solid #d9e2da">+ Warm-up-Satz</button><button id="saveWarm" class="complete">Speichern</button>`);sheetBody.querySelectorAll('[data-delwarm]').forEach(b=>b.onclick=()=>b.parentElement.remove());addWarm.onclick=()=>warmRows.insertAdjacentHTML('beforeend','<div class="warm-row"><input inputmode="decimal" placeholder="kg"><input inputmode="numeric" placeholder="Wdh."><button>×</button></div>');saveWarm.onclick=()=>{d.warm=[...warmRows.querySelectorAll('.warm-row')].map(r=>[Number(r.children[0].value),Number(r.children[1].value)]).filter(r=>r[0]&&r[1]);sheet.classList.remove('open');render()}}function openInfo(b){const key=[...b.attributes].find(a=>a.name.startsWith('data-'))?.name||'';openSheet('Prototyp-Details',`<p>Diese Ansicht wird in der Live-Version mit den gespeicherten Daten, Ausführungshinweisen und dem vollständigen Verlauf des konkreten Geräts gefüllt.</p><p><strong>Aktiver Bereich:</strong> ${key.replace('data-','')}</p>`)}order.onclick=()=>{openSheet('Übungsreihenfolge',exercises.map((e,i)=>`<div class="order"><b>${i+1}</b><strong>${e.name}</strong><div><button data-up="${i}">↑</button><button data-down="${i}">↓</button></div></div>`).join(''));sheetBody.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>move(+b.dataset.up,-1));sheetBody.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>move(+b.dataset.down,1))}function move(i,d){const j=i+d;if(j<0||j>=exercises.length)return;[exercises[i],exercises[j]]=[exercises[j],exercises[i]];current=j;sheet.classList.remove('open');render()}sheetClose.onclick=()=>sheet.classList.remove('open');sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('open')};lightClose.onclick=()=>lightbox.classList.remove('open');lightbox.onclick=e=>{if(e.target===lightbox)lightbox.classList.remove('open')};timer.onclick=()=>{running=!running;timer.style.background=running?'#e3eee6':'#fff'};setInterval(()=>{if(!running)return;seconds++;timer.textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`},1000);render();</script></body></html>
