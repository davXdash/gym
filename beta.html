<!doctype html><html lang="de" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>GYM Beta 2</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;--bg:#f3f5f2;--surface:#fff;--surface2:#f3f6f3;--text:#171a18;--muted:#6b736d;--line:#d9dfda;--accent:#416a50;--accentSoft:#edf5ef;--danger:#9a4d45;color:var(--text);background:var(--bg)}html[data-theme="dark"]{--bg:#101512;--surface:#18201b;--surface2:#202a23;--text:#f2f5f3;--muted:#aeb8b1;--line:#344038;--accent:#719a7d;--accentSoft:#253a2b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input{font:inherit;color:inherit}.shell{max-width:760px;margin:auto;padding:18px 16px 50px}.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(18px);padding:12px 0}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.beta{display:inline-flex;padding:6px 10px;border-radius:999px;background:#111;color:#fff;font-size:12px;font-weight:800}.theme{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:var(--surface);font-size:19px}.top h1{margin:9px 0 4px;font-size:30px}.top p{margin:0;color:var(--muted)}.switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.switch button,.edit,.chip,.secondary{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;font-weight:700}.switch button.active{background:var(--accent);color:#fff;border-color:var(--accent)}.exercise{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px;margin:12px 0;box-shadow:0 8px 26px rgba(30,45,35,.05)}.head{display:flex;justify-content:space-between;gap:12px}.n,.eyebrow{font-size:12px;color:var(--accent);font-weight:800;letter-spacing:.02em}.exercise h2{font-size:19px;margin:5px 0}.meta{color:var(--muted);font-size:13px}.last,.coach{margin:13px 0;padding:12px;border-radius:16px;background:var(--surface2)}.last strong,.coach strong{display:block;margin-bottom:4px}.coach .target{font-size:20px;font-weight:850;margin:3px 0}.coach p{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.4}.alts{display:flex;gap:8px;overflow:auto;padding:2px 1px 5px;scrollbar-width:none}.alts::-webkit-scrollbar{display:none}.alt{flex:0 0 180px;border:1px solid var(--line);background:var(--surface2);border-radius:16px;padding:11px;text-align:left}.alt.first,.alt.active{border-color:var(--accent);background:var(--accentSoft)}.alt b{display:block;font-size:13px}.alt small{display:block;color:var(--muted);margin-top:5px}.edit{margin-top:10px;width:100%;color:var(--accent)}.sets{display:grid;gap:9px;margin-top:14px}.setrow{display:grid;grid-template-columns:32px 1fr 1fr 1fr;gap:8px;align-items:end}.setno{width:32px;height:32px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-weight:800}.field{display:grid;gap:4px}.field label{font-size:11px;color:var(--muted);font-weight:700}.field input{width:100%;min-width:0;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);padding:0 9px;font-size:16px}.setactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.secondary{background:var(--surface2)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;place-items:end center;z-index:20}.modal.open{display:grid}.sheet{width:min(760px,100%);max-height:82vh;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:18px}.sheet header{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--surface);padding-bottom:10px}.search{width:100%;height:46px;border:1px solid var(--line);border-radius:14px;padding:0 12px;font-size:16px;background:var(--surface2);color:var(--text)}.row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}.row input{width:22px;height:22px}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:430px){.shell{padding-left:12px;padding-right:12px}.exercise{padding:14px}.setrow{grid-template-columns:28px repeat(3,minmax(0,1fr));gap:6px}.field input{padding:0 6px}}
</style></head><body><main class="shell"><header class="top"><div class="topline"><span class="beta">BETA 2</span><button class="theme" id="theme" aria-label="Darstellung wechseln">◐</button></div><h1>Trainingsübersicht B</h1><p>Interaktive Testansicht. Speichert Eingaben nur lokal in der Beta und verändert die Live-Datenbank nicht.</p><div class="switch"><button data-code="A" class="active">Training A</button><button data-code="B">Training B</button></div></header><section id="list"></section></main><div class="modal" id="modal"><div class="sheet"><header><div><small>ALTERNATIVEN</small><h2 id="modal-title"></h2></div><button class="chip" id="close">Fertig</button></header><input class="search" id="search" placeholder="Gerät suchen"><div id="choices"></div></div></div><script>
const SNAP='gym-snapshot-v11',HIST='gym-device-history',STUDIO='gym-studio-profile-v35',OVR='gym-beta-alternatives',DRAFT='gym-beta2-draft',PREF='gym-beta2-preferred',THEME='gym-theme';
const read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const canon=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,' ').trim();
const BASE={'Schrägbankdrückmaschine dual':['Schrägbankdrückmaschine dual','Schrägbankmaschine sitzend','Kurzhantel Schrägbankdrücken','Bankdrückmaschine sitzend dual'],'Kurzhantel Schrägbankdrücken':['Kurzhantel Schrägbankdrücken','Schrägbankdrückmaschine dual','Schrägbankmaschine sitzend'],'Brustpresse sitzend':['Brustpresse sitzend','Bankdrückmaschine sitzend dual','Bankdrückmaschine liegend dual'],'Butterfly mit Griffen':['Butterfly mit Griffen','Butterfly dual'],'Latzugstation mit Oberschenkelpolster':['Latzugstation mit Oberschenkelpolster','Rückenzugmaschine dual','High Row dual'],'Rudermaschine mit Brustpolster':['Rudermaschine mit Brustpolster','Low Row dual','High Row dual','Ruderzugstation'],'High Row dual':['High Row dual','Rückenzugmaschine dual','Rudermaschine mit Brustpolster'],'Low Row dual':['Low Row dual','Rudermaschine mit Brustpolster','High Row dual'],'Seithebemaschine ohne Armpolster':['Seithebemaschine ohne Armpolster','Seithebemaschine dual ohne Armpolster','Kurzhantel Seitheben sitzend','Kurzhantel Seitheben stehend'],'Butterfly reverse mit Griffen':['Butterfly reverse mit Griffen','Butterfly Reverse dual'],'Bizepsmaschine':['Bizepsmaschine','Bizepsmaschine Plateloaded','Bizepsmaschine dual','Scott Curler Sitzend'],'Trizepsmaschine Überkopf':['Trizepsmaschine Überkopf','Trizepsmaschine horizontal','Trizeps Dip Maschine sitzend dual'],'Bauchmuskelmaschine':['Bauchmuskelmaschine','Bauchmuskelmaschine Crunch liegend','Klappsitz Bauchmaschine sitzend']};
let code='A',editing=null;
function profile(){return read(STUDIO,read('gym-studio-profile-v32',{devices:{}}))}function available(){return Object.entries(profile().devices||{}).filter(([,v])=>v?.present!=='no').map(([n])=>n)}
function hist(name){const h=read(HIST,{}),k=canon(name);return h[name]||Object.entries(h).find(([n])=>canon(n)===k)?.[1]||null}
function worksets(name){return(hist(name)?.sets||[]).filter(s=>!s.warmup&&String(s.weight??'')!==''&&String(s.reps??'')!=='')}
function used(name){return hist(name)?.date||''}
function variants(ex){const o=read(OVR,{}),raw=o[ex.name]||BASE[ex.name]||[ex.name],pref=read(PREF,{})[ex.name];let seen=[...new Set(raw.filter(n=>available().some(a=>canon(a)===canon(n))||canon(n)===canon(ex.name)))];seen.sort((a,b)=>used(b).localeCompare(used(a)));if(pref&&seen.some(n=>canon(n)===canon(pref)))seen.sort((a,b)=>canon(a)===canon(pref)?-1:canon(b)===canon(pref)?1:0);return seen}
function lastSummary(v){const sets=worksets(v);if(!sets.length)return'Noch keine Werte';const last=sets.at(-1);return`${sets.length} Arbeitssätze · zuletzt ${last.weight} kg × ${last.reps}${last.rir!==''&&last.rir!=null?` · RIR ${last.rir}`:''}`}
function coach(ex,v){const sets=worksets(v),planSets=Number(ex.target_sets)||3,min=Number(ex.rep_min)||8,max=Number(ex.rep_max)||12;if(!sets.length)return{sets:planSets,title:'Erste Referenz setzen',text:`${planSets} Arbeitssätze · ${min}–${max} Wdh. · RIR 1–2`,kg:'',reps:min,rir:2};const top=sets.reduce((a,b)=>Number(b.weight)>Number(a.weight)||(Number(b.weight)===Number(a.weight)&&Number(b.reps)>Number(a.reps))?b:a),last=sets.at(-1),rir=Number(last.rir),hard=Number.isFinite(rir)&&rir<=0,targetSets=hard?Math.min(2,planSets):planSets,targetReps=Math.min(max,Number(top.reps||min)+1);return{sets:targetSets,title:`${top.weight} kg · Ziel ${targetReps} Wdh.`,text:`Basis: ${sets.length} Arbeitssätze letztes Mal. Topsatz ${top.weight} kg × ${top.reps}${top.rir!==''&&top.rir!=null?` · RIR ${top.rir}`:''}.${hard?` Wegen RIR ${last.rir}: heute ${targetSets} harte Sätze.`:` Planrahmen heute ${targetSets} Sätze.`}`,kg:top.weight,reps:targetReps,rir:hard?1:2}}
function draftKey(ex){return`${code}|${ex.id||ex.plan_exercise_id||ex.name}`}
function draftFor(ex,v,c){const all=read(DRAFT,{}),key=draftKey(ex),old=all[key];if(old&&canon(old.variant)===canon(v))return old;return{variant:v,sets:Array.from({length:c.sets},(_,i)=>({weight:i===0&&c.kg!==''?String(c.kg):'',reps:i===0?String(c.reps):'',rir:i===0?String(c.rir):''}))}}
function saveDraft(ex,v,d){const all=read(DRAFT,{});all[draftKey(ex)]={...d,variant:v};write(DRAFT,all)}
function chooseVariant(ex,name){const pref=read(PREF,{});pref[ex.name]=name;write(PREF,pref);const c=coach(ex,name),d=draftFor(ex,name,c);saveDraft(ex,name,d);render()}
function render(){const s=read(SNAP,{workouts:{}}),w=s.workouts?.[code],root=document.querySelector('#list');document.querySelectorAll('[data-code]').forEach(b=>b.classList.toggle('active',b.dataset.code===code));if(!w){root.innerHTML='<div class="empty">Kein Plan im lokalen Speicher.</div>';return}root.innerHTML=(w.exercises||[]).map((ex,i)=>{const vs=variants(ex),first=vs[0]||ex.name,h=hist(first),c=coach(ex,first),d=draftFor(ex,first,c);return`<article class="exercise" data-ex="${i}"><div class="head"><div><div class="n">ÜBUNG ${i+1}</div><h2>${ex.name}</h2><div class="meta">Plan: ${ex.target_sets||3} Sätze · ${ex.rep_min||8}–${ex.rep_max||12} Wdh.</div></div></div><div class="last"><strong>Letztes Mal · ${first}</strong>${h?`${lastSummary(first)}${h.date?` · ${h.date}`:''}`:'Für dieses Gerät noch keine Historie.'}</div><div class="alts">${vs.map((v,j)=>`<button class="alt ${j===0?'first active':''}" data-variant="${encodeURIComponent(v)}" data-index="${i}"><b>${v}</b><small>${j===0&&h?'Zuletzt/ausgewählt · ':''}${lastSummary(v)}</small></button>`).join('')}</div><button class="edit" data-edit="${encodeURIComponent(ex.name)}">Alternativen bearbeiten</button><div class="coach"><span class="eyebrow">COACH · HEUTE</span><div class="target">${c.title}</div><strong>${c.sets} Arbeitssätze empfohlen</strong><p>${c.text}</p></div><div class="sets">${d.sets.map((set,si)=>`<div class="setrow"><span class="setno">${si+1}</span><div class="field"><label>kg</label><input inputmode="decimal" data-set="${si}" data-field="weight" data-exindex="${i}" value="${set.weight??''}"></div><div class="field"><label>Wdh.</label><input inputmode="numeric" data-set="${si}" data-field="reps" data-exindex="${i}" value="${set.reps??''}"></div><div class="field"><label>RIR</label><input inputmode="decimal" data-set="${si}" data-field="rir" data-exindex="${i}" value="${set.rir??''}"></div></div>`).join('')}</div><div class="setactions"><button class="secondary" data-remove-set="${i}">− Satz</button><button class="secondary" data-add-set="${i}">+ Satz</button></div></article>`}).join('');
root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(decodeURIComponent(b.dataset.edit)));root.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>{const ex=w.exercises[Number(b.dataset.index)];chooseVariant(ex,decodeURIComponent(b.dataset.variant))});root.querySelectorAll('input[data-field]').forEach(inp=>inp.oninput=()=>{const ex=w.exercises[Number(inp.dataset.exindex)],v=variants(ex)[0]||ex.name,c=coach(ex,v),d=draftFor(ex,v,c),row=d.sets[Number(inp.dataset.set)];if(row){row[inp.dataset.field]=inp.value;saveDraft(ex,v,d)}});root.querySelectorAll('[data-add-set]').forEach(b=>b.onclick=()=>{const ex=w.exercises[Number(b.dataset.addSet)],v=variants(ex)[0]||ex.name,c=coach(ex,v),d=draftFor(ex,v,c);d.sets.push({weight:'',reps:'',rir:''});saveDraft(ex,v,d);render()});root.querySelectorAll('[data-remove-set]').forEach(b=>b.onclick=()=>{const ex=w.exercises[Number(b.dataset.removeSet)],v=variants(ex)[0]||ex.name,c=coach(ex,v),d=draftFor(ex,v,c);if(d.sets.length>1)d.sets.pop();saveDraft(ex,v,d);render()})}
function openEditor(name){editing=name;document.querySelector('#modal-title').textContent=name;document.querySelector('#search').value='';paintChoices();document.querySelector('#modal').classList.add('open')}
function paintChoices(){const term=canon(document.querySelector('#search').value),all=available().filter(n=>!term||canon(n).includes(term)),o=read(OVR,{}),selected=new Set(o[editing]||BASE[editing]||[editing]),root=document.querySelector('#choices');root.innerHTML=all.map(n=>`<label class="row"><input type="checkbox" data-choice="${encodeURIComponent(n)}" ${selected.has(n)?'checked':''}><span>${n}</span></label>`).join('');root.querySelectorAll('[data-choice]').forEach(c=>c.onchange=()=>{const o=read(OVR,{}),set=new Set(o[editing]||BASE[editing]||[editing]),n=decodeURIComponent(c.dataset.choice);c.checked?set.add(n):set.delete(n);set.add(editing);o[editing]=[...set];write(OVR,o);render()})}
function applyTheme(){document.documentElement.dataset.theme=localStorage.getItem(THEME)||'light'}applyTheme();document.querySelector('#theme').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem(THEME,next)};document.querySelectorAll('[data-code]').forEach(b=>b.onclick=()=>{code=b.dataset.code;render()});document.querySelector('#search').oninput=paintChoices;document.querySelector('#close').onclick=()=>document.querySelector('#modal').classList.remove('open');document.querySelector('#modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')};render();
</script></body></html>
