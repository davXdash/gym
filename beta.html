<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GYM Beta</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;color:#171a18;background:#f3f5f2}*{box-sizing:border-box}body{margin:0}.shell{max-width:760px;margin:auto;padding:18px 16px 50px}.top{position:sticky;top:0;z-index:5;background:rgba(243,245,242,.92);backdrop-filter:blur(18px);padding:12px 0}.beta{display:inline-flex;padding:6px 10px;border-radius:999px;background:#111;color:#fff;font-size:12px;font-weight:800}.top h1{margin:9px 0 4px;font-size:30px}.top p{margin:0;color:#6d746f}.switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.switch button,.edit,.chip{border:1px solid #d5dbd6;background:#fff;border-radius:14px;padding:12px;font:inherit;font-weight:700}.switch button.active{background:#416a50;color:white;border-color:#416a50}.exercise{background:#fff;border:1px solid #dde2de;border-radius:24px;padding:16px;margin:12px 0;box-shadow:0 8px 26px rgba(30,45,35,.05)}.head{display:flex;justify-content:space-between;gap:12px}.n{font-size:12px;color:#66806e;font-weight:800}.exercise h2{font-size:19px;margin:5px 0}.meta{color:#6b736d;font-size:13px}.last{margin:13px 0;padding:12px;border-radius:16px;background:#f3f6f3}.last strong{display:block;margin-bottom:4px}.alts{display:flex;gap:8px;overflow:auto;padding:2px 1px 5px}.alt{flex:0 0 180px;border:1px solid #d9dfda;background:#fafbfa;border-radius:16px;padding:11px;text-align:left}.alt.first{border-color:#5d896b;background:#edf5ef}.alt b{display:block;font-size:13px}.alt small{display:block;color:#737a75;margin-top:5px}.edit{margin-top:10px;width:100%;color:#416a50}.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;place-items:end center;z-index:20}.modal.open{display:grid}.sheet{width:min(760px,100%);max-height:82vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:18px}.sheet header{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;padding-bottom:10px}.search{width:100%;height:46px;border:1px solid #d6dcd7;border-radius:14px;padding:0 12px;font-size:16px}.row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid #eee}.row input{width:22px;height:22px}.empty{padding:30px;text-align:center;color:#777}@media(prefers-color-scheme:dark){:root{background:#101512;color:#f2f5f3}.top{background:rgba(16,21,18,.92)}.exercise,.switch button,.edit,.sheet{background:#18201b;border-color:#303a33}.switch button.active{background:#719a7d}.last,.alt{background:#202a23;border-color:#344038}.alt.first{background:#253a2b}.search{background:#111713;color:white;border-color:#384139}.top p,.meta,.alt small{color:#aeb8b1}}
</style></head><body><main class="shell"><header class="top"><span class="beta">BETA 1</span><h1>Trainingsübersicht B</h1><p>Nur Testansicht. Verändert deinen Live-Trainingsplan nicht.</p><div class="switch"><button data-code="A" class="active">Training A</button><button data-code="B">Training B</button></div></header><section id="list"></section></main><div class="modal" id="modal"><div class="sheet"><header><div><small>ALTERNATIVEN</small><h2 id="modal-title"></h2></div><button class="chip" id="close">Fertig</button></header><input class="search" id="search" placeholder="Gerät suchen"><div id="choices"></div></div></div><script>
const SNAP='gym-snapshot-v11',HIST='gym-device-history',STUDIO='gym-studio-profile-v35',OVR='gym-beta-alternatives';
const read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const canon=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,' ').trim();
const BASE={
'Schrägbankdrückmaschine dual':['Schrägbankdrückmaschine dual','Schrägbankmaschine sitzend','Kurzhantel Schrägbankdrücken','Bankdrückmaschine sitzend dual'],
'Kurzhantel Schrägbankdrücken':['Kurzhantel Schrägbankdrücken','Schrägbankdrückmaschine dual','Schrägbankmaschine sitzend'],
'Brustpresse sitzend':['Brustpresse sitzend','Bankdrückmaschine sitzend dual','Bankdrückmaschine liegend dual'],
'Butterfly mit Griffen':['Butterfly mit Griffen','Butterfly dual'],
'Latzugstation mit Oberschenkelpolster':['Latzugstation mit Oberschenkelpolster','Rückenzugmaschine dual','High Row dual'],
'Rudermaschine mit Brustpolster':['Rudermaschine mit Brustpolster','Low Row dual','High Row dual','Ruderzugstation'],
'High Row dual':['High Row dual','Rückenzugmaschine dual','Rudermaschine mit Brustpolster'],
'Low Row dual':['Low Row dual','Rudermaschine mit Brustpolster','High Row dual'],
'Seithebemaschine ohne Armpolster':['Seithebemaschine ohne Armpolster','Seithebemaschine dual ohne Armpolster','Kurzhantel Seitheben sitzend','Kurzhantel Seitheben stehend'],
'Butterfly reverse mit Griffen':['Butterfly reverse mit Griffen','Butterfly Reverse dual'],
'Bizepsmaschine':['Bizepsmaschine','Bizepsmaschine Plateloaded','Bizepsmaschine dual','Scott Curler Sitzend'],
'Trizepsmaschine Überkopf':['Trizepsmaschine Überkopf','Trizepsmaschine horizontal','Trizeps Dip Maschine sitzend dual'],
'Bauchmuskelmaschine':['Bauchmuskelmaschine','Bauchmuskelmaschine Crunch liegend','Klappsitz Bauchmaschine sitzend']};
let code='A',editing=null;
function profile(){return read(STUDIO,read('gym-studio-profile-v32',{devices:{}}))}function available(){return Object.entries(profile().devices||{}).filter(([,v])=>v?.present!=='no').map(([n])=>n)}
function hist(name){const h=read(HIST,{}),k=canon(name);return h[name]||Object.entries(h).find(([n])=>canon(n)===k)?.[1]||null}function used(name){const h=hist(name);return h?.date||''}
function variants(ex){const o=read(OVR,{}),raw=o[ex.name]||BASE[ex.name]||[ex.name];const seen=[...new Set(raw.filter(n=>available().some(a=>canon(a)===canon(n))||canon(n)===canon(ex.name)))];return seen.sort((a,b)=>used(b).localeCompare(used(a)))}
function lastSummary(v){const h=hist(v),sets=(h?.sets||[]).filter(s=>!s.warmup&&String(s.weight??'')!==''&&String(s.reps??'')!=='');if(!sets.length)return'Noch keine Werte';const last=sets.at(-1);return`${sets.length} Arbeitssätze · zuletzt ${last.weight} kg × ${last.reps}${last.rir!==''&&last.rir!=null?` · RIR ${last.rir}`:''}`}
function render(){const s=read(SNAP,{workouts:{}}),w=s.workouts?.[code],root=document.querySelector('#list');document.querySelectorAll('[data-code]').forEach(b=>b.classList.toggle('active',b.dataset.code===code));if(!w){root.innerHTML='<div class="empty">Kein Plan im lokalen Speicher.</div>';return}root.innerHTML=(w.exercises||[]).map((ex,i)=>{const vs=variants(ex),first=vs[0]||ex.name,h=hist(first);return`<article class="exercise"><div class="head"><div><div class="n">ÜBUNG ${i+1}</div><h2>${ex.name}</h2><div class="meta">Plan: ${ex.target_sets||3} Sätze · ${ex.rep_min||8}–${ex.rep_max||12} Wdh.</div></div></div><div class="last"><strong>Letztes Mal · ${first}</strong>${h?`${lastSummary(first)}${h.date?` · ${h.date}`:''}`:'Für dieses Gerät noch keine Historie.'}</div><div class="alts">${vs.map((v,j)=>`<button class="alt ${j===0?'first':''}"><b>${v}</b><small>${j===0&&h?'Zuletzt verwendet · ':''}${lastSummary(v)}</small></button>`).join('')}</div><button class="edit" data-edit="${encodeURIComponent(ex.name)}">Alternativen bearbeiten</button></article>`}).join('');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(decodeURIComponent(b.dataset.edit)));}
function openEditor(name){editing=name;document.querySelector('#modal-title').textContent=name;document.querySelector('#search').value='';paintChoices();document.querySelector('#modal').classList.add('open')}
function paintChoices(){const term=canon(document.querySelector('#search').value),all=available().filter(n=>!term||canon(n).includes(term)),o=read(OVR,{}),selected=new Set(o[editing]||BASE[editing]||[editing]),root=document.querySelector('#choices');root.innerHTML=all.map(n=>`<label class="row"><input type="checkbox" data-choice="${encodeURIComponent(n)}" ${selected.has(n)?'checked':''}><span>${n}</span></label>`).join('');root.querySelectorAll('[data-choice]').forEach(c=>c.onchange=()=>{const o=read(OVR,{}),set=new Set(o[editing]||BASE[editing]||[editing]),n=decodeURIComponent(c.dataset.choice);c.checked?set.add(n):set.delete(n);set.add(editing);o[editing]=[...set];write(OVR,o);render()})}
document.querySelectorAll('[data-code]').forEach(b=>b.onclick=()=>{code=b.dataset.code;render()});document.querySelector('#search').oninput=paintChoices;document.querySelector('#close').onclick=()=>document.querySelector('#modal').classList.remove('open');document.querySelector('#modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')};render();
</script></body></html>
