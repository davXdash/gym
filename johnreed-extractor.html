<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JR Bild-Extraktor</title>
<style>
:root{--pink:#d72d68;--bg:#f5f5f3;--card:#fff;--text:#111;--muted:#777;--line:#e4e4e1}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}main{max-width:980px;margin:auto;padding:28px 18px 70px}h1{font-size:32px;margin:0 0 6px}p{line-height:1.45}.muted{color:var(--muted)}.drop{background:#fff;border:2px dashed #bbb;border-radius:22px;padding:35px 20px;text-align:center;margin:24px 0;cursor:pointer}.drop.drag{border-color:var(--pink);background:#fff7fa}.btn{display:inline-block;background:#111;color:#fff;border:0;border-radius:13px;padding:12px 18px;font-weight:700;cursor:pointer}.pink{background:var(--pink)}input[type=file]{display:none}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:20px}.card{background:#fff;border-radius:18px;padding:13px;box-shadow:0 1px 4px #0000000b}.card img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#eee;border-radius:12px}.name{font-weight:800;margin:9px 0 3px}.type{font-size:12px;color:var(--pink);font-weight:800;text-transform:uppercase}.status{font-size:13px;color:var(--muted)}.download{margin-top:9px;border:1px solid #ccc;background:#fff;border-radius:10px;padding:8px 10px;font-weight:650;cursor:pointer}.warn{color:#9b5a00}.ok{color:#267442}.summary{background:#fff;border-radius:16px;padding:13px 16px;margin:15px 0}.hidden{display:none}code{font-size:12px}</style>
</head><body><main>
<h1>John Reed Bild-Extraktor</h1><p class="muted">Einmaliges Arbeitswerkzeug. Screenshots hineinziehen oder auswählen. Das Tool erkennt automatisch Übersichts- und Detailseiten, schneidet die Übungsbilder aus und benennt sie nach der Übung.</p>
<div id="drop" class="drop"><strong>Screenshots hier ablegen</strong><br><span class="muted">oder</span><br><br><label class="btn pink" for="files">Bilder auswählen</label><input id="files" type="file" accept="image/*" multiple></div>
<div class="toolbar"><button class="btn" id="all" disabled>Alle Ergebnisse herunterladen</button><button class="btn" id="clear">Leeren</button></div>
<div id="summary" class="summary hidden"></div><div id="cards" class="cards"></div>
<script>
const $=s=>document.querySelector(s), files=$('#files'),drop=$('#drop'),cards=$('#cards'),summary=$('#summary'),all=$('#all');let results=[];
function safe(s){return (s||'Unbenannt').replace(/[\\/:*?"<>|]/g,'-').replace(/\s+/g,' ').trim()}
function loadImage(file){return new Promise((res,rej)=>{let i=new Image;i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
function canvasCrop(img,x,y,w,h){let c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));c.getContext('2d').drawImage(img,x,y,w,h,0,0,c.width,c.height);return c}
async function ocr(canvas){if(!('TextDetector'in window))return '';try{let d=new TextDetector();let a=await d.detect(canvas);return a.map(x=>x.rawValue).join(' ').replace(/\s+/g,' ').trim()}catch(e){return ''}}
function classify(img){return img.height/img.width>1.55?'phone':'unknown'}
async function process(file){let img=await loadImage(file),w=img.naturalWidth,h=img.naturalHeight;let full=canvasCrop(img,0,0,w,h);let text=await ocr(full);let detail=/BEN[ÖO]TIGTES\s+EQUIPMENT/i.test(text)||/ÜBUNGSAUSFÜHRUNG|UBUNGSAUSFUHRUNG/i.test(text);if(detail){let titleCanvas=canvasCrop(img,0,h*.52,w,h*.22),title=await ocr(titleCanvas);title=title.replace(/BEN[ÖO]TIGTES.*$/i,'').replace(/ÜBUNGSAUSFÜHRUNG.*$/i,'').trim();let crop=canvasCrop(img,0,h*.08,w,h*.51);return add(file,crop,title||file.name.replace(/\.[^.]+$/,''),'detail',!!title)}
// Übersicht: graue quadratische Kacheln über Pixelanalyse finden.
let c=full,ctx=c.getContext('2d'),d=ctx.getImageData(0,0,w,h).data;let scale=Math.max(1,Math.floor(w/220)),hits=[];for(let y=Math.floor(h*.34);y<h*.93;y+=scale*5){let run=0,start=0;for(let x=0;x<w*.35;x+=scale){let p=(y*w+x)*4,r=d[p],g=d[p+1],b=d[p+2],grey=Math.max(r,g,b)-Math.min(r,g,b)<13&&r>205&&r<245;if(grey){if(!run)start=x;run+=scale}else if(run>w*.14){hits.push({x:start,y});run=0}else run=0}}
hits.sort((a,b)=>a.y-b.y);let ys=[];for(let q of hits)if(!ys.some(v=>Math.abs(v-q.y)<w*.12))ys.push(q.y);if(!ys.length)return add(file,full,file.name.replace(/\.[^.]+$/,''),'review',false);for(let y of ys){let size=Math.min(w*.24,h*.14),x=w*.035;let crop=canvasCrop(img,x,Math.max(0,y-size*.35),size,size);let tc=canvasCrop(img,w*.27,Math.max(0,y-size*.35),w*.69,size);let name=await ocr(tc);await add(file,crop,name||file.name.replace(/\.[^.]+$/,''),'thumb',!!name)} }
async function add(file,canvas,name,type,conf){let blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.94));let item={blob,name:safe(name),type,conf,source:file.name};results.push(item);render(item);update()}
function render(r){let url=URL.createObjectURL(r.blob),el=document.createElement('div');el.className='card';el.innerHTML=`<img src="${url}"><div class="type">${r.type==='detail'?'Großes Detailbild':r.type==='thumb'?'Kleines Übersichtsbild':'Prüfen'}</div><div class="name">${r.name}</div><div class="status ${r.conf?'ok':'warn'}">${r.conf?'Name automatisch erkannt':'Name bitte prüfen / Browser-OCR nicht verfügbar'}</div><button class="download">${r.name}.jpg</button>`;el.querySelector('button').onclick=()=>download(r);cards.append(el)}
function download(r){let a=document.createElement('a');a.href=URL.createObjectURL(r.blob);a.download=`${r.type==='detail'?'detail':'thumb'}__${r.name}.jpg`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function update(){all.disabled=!results.length;let t=results.filter(x=>x.type==='thumb').length,d=results.filter(x=>x.type==='detail').length,q=results.filter(x=>!x.conf).length;summary.classList.remove('hidden');summary.innerHTML=`<strong>${results.length} Bilder extrahiert</strong> · ${t} klein · ${d} groß · ${q} zu prüfen<br><span class="muted">Große und kleine Bilder bleiben getrennt. Ein späteres Detailbild kann dadurch das Thumbnail in der Datenbank ersetzen, ohne es zu löschen.</span>`}
async function handle(fs){for(let f of fs)if(f.type.startsWith('image/'))try{await process(f)}catch(e){console.error(f.name,e)}}
files.onchange=e=>handle(e.target.files);drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');handle(e.dataTransfer.files)};$('#clear').onclick=()=>{results=[];cards.innerHTML='';summary.classList.add('hidden');all.disabled=true};all.onclick=()=>results.forEach((r,i)=>setTimeout(()=>download(r),i*180));
</script></main></body></html>
