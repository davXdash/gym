<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JR Bild-Extraktor</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{--pink:#d72d68;--bg:#f5f5f3;--card:#fff;--text:#111;--muted:#777;--ok:#276f45;--warn:#9b5a00}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}main{max-width:980px;margin:auto;padding:28px 18px 70px}h1{font-size:32px;margin:0 0 6px}p{line-height:1.45}.muted{color:var(--muted)}.drop{background:#fff;border:2px dashed #bbb;border-radius:22px;padding:35px 20px;text-align:center;margin:24px 0;cursor:pointer}.drop.drag{border-color:var(--pink);background:#fff7fa}.btn{display:inline-block;background:#111;color:#fff;border:0;border-radius:13px;padding:12px 18px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.4}.pink{background:var(--pink)}input[type=file]{display:none}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:20px}.card{background:#fff;border-radius:18px;padding:13px;box-shadow:0 1px 4px #0000000b}.card img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#eee;border-radius:12px}.name-input{width:100%;font:inherit;font-weight:800;border:1px solid #d5d8d4;border-radius:10px;padding:8px 9px;margin:9px 0 3px}.type{font-size:12px;color:var(--pink);font-weight:800;text-transform:uppercase}.status{font-size:13px;color:var(--muted)}.download{margin-top:9px;border:1px solid #ccc;background:#fff;border-radius:10px;padding:8px 10px;font-weight:650;cursor:pointer}.warn{color:var(--warn)}.ok{color:var(--ok)}.summary{background:#fff;border-radius:16px;padding:13px 16px;margin:15px 0}.progress{height:8px;background:#e6e7e4;border-radius:999px;overflow:hidden;margin-top:9px}.progress>i{display:block;height:100%;width:0;background:var(--pink);transition:width .2s}.hidden{display:none}.debug{font-size:12px;color:#666;margin-top:5px}</style>
</head><body><main>
<h1>John Reed Bild-Extraktor</h1>
<p class="muted">Übersichtsseiten werden jetzt über die echten grauen Bildkacheln erkannt. Die Namens-OCR läuft anschließend nur auf dem Text rechts neben jeder Kachel. Dadurch hängt die Bilderkennung nicht mehr von OCR-Koordinaten ab.</p>
<div id="drop" class="drop"><strong>Screenshots hier ablegen</strong><br><span class="muted">oder</span><br><br><label class="btn pink" for="files">Bilder auswählen</label><input id="files" type="file" accept="image/*" multiple></div>
<div class="toolbar"><button class="btn" id="all" disabled>Alle Ergebnisse herunterladen</button><button class="btn" id="clear">Leeren</button></div>
<div id="summary" class="summary hidden"></div><div id="cards" class="cards"></div>
<script>
const $=s=>document.querySelector(s),files=$('#files'),drop=$('#drop'),cards=$('#cards'),summary=$('#summary'),all=$('#all');
let results=[],worker=null,busy=false;
function safe(s){return (s||'Unbenannt').replace(/[\\/:*?"<>|]/g,'-').replace(/\s+/g,' ').trim()}
function loadImage(file){return new Promise((res,rej)=>{const i=new Image(),u=URL.createObjectURL(file);i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=rej;i.src=u})}
function crop(img,x,y,w,h,scale=1){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*scale));c.height=Math.max(1,Math.round(h*scale));c.getContext('2d').drawImage(img,x,y,w,h,0,0,c.width,c.height);return c}
function setStatus(txt,pct=0,sub=''){summary.classList.remove('hidden');summary.innerHTML=`<strong>${txt}</strong>${sub?`<div class="debug">${sub}</div>`:''}<div class="progress"><i style="width:${pct}%"></i></div>`}
async function getWorker(){if(worker)return worker;setStatus('OCR wird geladen …');worker=await Tesseract.createWorker('deu');return worker}
async function ocrCanvas(canvas,psm=7){const w=await getWorker();const r=await w.recognize(canvas,{tessedit_pageseg_mode:String(psm)});return (r.data.text||'').replace(/\s+/g,' ').trim()}
function cleanName(s){return safe((s||'').replace(/[|_[\]{}]/g,' ').replace(/\s+/g,' ').replace(/^[-–—·. ]+|[-–—·. ]+$/g,'').trim())}
function isGrey(r,g,b){const max=Math.max(r,g,b),min=Math.min(r,g,b),avg=(r+g+b)/3;return max-min<20&&avg>210&&avg<248}
function findThumbRows(img){
  const w=img.naturalWidth,h=img.naturalHeight,c=crop(img,0,0,w,h),ctx=c.getContext('2d'),data=ctx.getImageData(0,0,w,h).data;
  const x1=Math.round(w*.025),x2=Math.round(w*.275),yStart=Math.round(h*.30),yEnd=Math.round(h*.95),step=Math.max(2,Math.round(w/420));
  const score=[];
  for(let y=yStart;y<yEnd;y+=step){let grey=0,total=0;for(let x=x1;x<x2;x+=step){const p=(y*w+x)*4;if(isGrey(data[p],data[p+1],data[p+2]))grey++;total++}score.push({y,v:grey/Math.max(1,total)})}
  const raw=[];let start=null,last=null;
  for(const s of score){if(s.v>.42){if(start===null)start=s.y;last=s.y}else if(start!==null){if(last-start>w*.07)raw.push({y1:start,y2:last});start=null;last=null}}
  if(start!==null&&last-start>w*.07)raw.push({y1:start,y2:last});
  const merged=[];for(const r of raw){const prev=merged.at(-1);if(prev&&r.y1-prev.y2<w*.035)prev.y2=r.y2;else merged.push({...r})}
  return merged.filter(r=>{const hh=r.y2-r.y1;return hh>w*.10&&hh<w*.38}).map(r=>({y1:Math.max(0,r.y1-w*.018),y2:Math.min(h,r.y2+w*.018),cy:(r.y1+r.y2)/2}));
}
function prepTextCanvas(img,row){
  const w=img.naturalWidth,h=img.naturalHeight;
  const y1=Math.max(0,row.y1-w*.025),y2=Math.min(h,row.y2+w*.025),x=Math.round(w*.275),rw=Math.round(w*.69),rh=y2-y1;
  const c=crop(img,x,y1,rw,rh,2),ctx=c.getContext('2d'),im=ctx.getImageData(0,0,c.width,c.height),d=im.data;
  for(let i=0;i<d.length;i+=4){const g=.299*d[i]+.587*d[i+1]+.114*d[i+2];const v=g<175?0:255;d[i]=d[i+1]=d[i+2]=v}ctx.putImageData(im,0,0);return c;
}
function imageCropForRow(img,row){const w=img.naturalWidth,h=img.naturalHeight,size=Math.round(w*.235),x=Math.round(w*.027),y=Math.round(row.cy-size/2);return crop(img,x,Math.max(0,Math.min(y,h-size)),size,size)}
function plausibleName(n){if(!n||n.length<4)return false;if(/^(training|alle|beine|core|rücken|brust|maschinen|home|club|kurse|übungen?)$/i.test(n))return false;if(/^(img[_ -]?\d+|\d+\s*übungen)$/i.test(n))return false;return /[A-Za-zÄÖÜäöüß]{3}/.test(n)}
async function processOverview(file,img,index,total,rows){
  for(let j=0;j<rows.length;j++){
    setStatus(`Analysiere ${index+1} von ${total}: ${file.name}`,Math.round(((index+j/Math.max(1,rows.length))/total)*100),`${rows.length} Gerätekacheln gefunden`);
    const tc=prepTextCanvas(img,rows[j]);let name=cleanName(await ocrCanvas(tc,6));
    name=name.replace(/^\d+\s*/,'').replace(/^(A|B|C|D|G|H|I|K|L|N|P|R|S|T|V|W|Ü)\s+/,'').trim();
    const thumb=imageCropForRow(img,rows[j]);await add(file,thumb,plausibleName(name)?name:file.name.replace(/\.[^.]+$/,''),'thumb',plausibleName(name));
  }
}
async function processDetail(file,img,index,total){
  const w=img.naturalWidth,h=img.naturalHeight;setStatus(`Detailseite ${index+1} von ${total}: ${file.name}`,Math.round(index/total*100));
  const titleArea=crop(img,w*.02,h*.49,w*.94,h*.19,2);let title=cleanName(await ocrCanvas(titleArea,6));
  title=title.replace(/BEN[ÖO]TIGTES.*$/i,'').replace(/ÜBUNGSAUSFÜHRUNG.*$/i,'').replace(/^TRAINING\s*/i,'').trim();
  const hero=crop(img,w*.02,h*.075,w*.96,h*.47);await add(file,hero,plausibleName(title)?title:file.name.replace(/\.[^.]+$/,''),'detail',plausibleName(title));
}
async function process(file,index,total){
  const img=await loadImage(file),rows=findThumbRows(img);
  if(rows.length>=1)return processOverview(file,img,index,total,rows);
  return processDetail(file,img,index,total);
}
async function add(file,canvas,name,type,conf){const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.95)),item={blob,name:safe(name),type,conf,source:file.name};results.push(item);render(item)}
function render(r){const url=URL.createObjectURL(r.blob),el=document.createElement('div');el.className='card';el.innerHTML=`<img src="${url}"><div class="type">${r.type==='detail'?'Großes Detailbild':'Kleines Übersichtsbild'}</div><input class="name-input" value="${r.name.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"><div class="status ${r.conf?'ok':'warn'}">${r.conf?'Name automatisch erkannt':'Name unsicher – bitte korrigieren'}</div><button class="download">Bild herunterladen</button>`;const inp=el.querySelector('input');inp.onchange=()=>r.name=safe(inp.value);el.querySelector('button').onclick=()=>download(r);cards.append(el)}
function download(r){const a=document.createElement('a'),u=URL.createObjectURL(r.blob);a.href=u;a.download=`${r.type==='detail'?'detail':'thumb'}__${safe(r.name)}.jpg`;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function doneStatus(){all.disabled=!results.length;const t=results.filter(x=>x.type==='thumb').length,d=results.filter(x=>x.type==='detail').length,q=results.filter(x=>!x.conf).length;summary.innerHTML=`<strong>Fertig: ${results.length} Bilder</strong> · ${t} klein · ${d} groß · ${q} Namen zu prüfen<br><span class="muted">Die Bildkacheln werden geometrisch erkannt; OCR entscheidet nur noch über den Dateinamen.</span>`}
async function handle(fs){if(busy)return;const arr=[...fs].filter(f=>f.type.startsWith('image/'));if(!arr.length)return;busy=true;files.disabled=true;cards.innerHTML='';results=[];try{await getWorker();for(let i=0;i<arr.length;i++){try{await process(arr[i],i,arr.length)}catch(e){console.error(e);setStatus(`Fehler bei ${arr[i].name}`,Math.round(i/arr.length*100),e?.message||String(e))}}doneStatus()}finally{busy=false;files.disabled=false}}
files.onchange=e=>handle(e.target.files);drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');handle(e.dataTransfer.files)};$('#clear').onclick=()=>{results=[];cards.innerHTML='';summary.classList.add('hidden');all.disabled=true};all.onclick=()=>results.forEach((r,i)=>setTimeout(()=>download(r),i*220));
</script></main></body></html>
