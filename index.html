<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>GYM</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app-shell">
    <section id="loading" class="screen centered">
      <p>App wird geladen …</p>
    </section>

    <section id="login-screen" class="screen hidden">
      <div class="card login-card">
        <p class="eyebrow">PRIVATE TRAINING</p>
        <h1>GYM</h1>
        <p class="muted">Anmeldung mit deinem Supabase-Konto.</p>
        <form id="login-form">
          <label>E-Mail
            <input id="email" type="email" autocomplete="username" value="Omm.Dav@gmail.com" required>
          </label>
          <label>Passwort
            <input id="password" type="password" autocomplete="current-password" required>
          </label>
          <button type="submit">Anmelden</button>
          <p id="login-error" class="error" role="alert"></p>
        </form>
      </div>
    </section>

    <section id="dashboard" class="screen hidden">
      <header class="topbar">
        <div>
          <p class="eyebrow">DEIN PLAN</p>
          <h1>Oberkörperaufbau</h1>
        </div>
        <button id="logout" class="secondary">Abmelden</button>
      </header>

      <section class="hero-card">
        <p class="muted">Als Nächstes</p>
        <h2 id="next-workout">Training A</h2>
        <p id="rotation-note">Die Reihenfolge läuft fort. Ausgefallene Tage überspringen kein Training.</p>
        <button id="start-workout">Training öffnen</button>
      </section>

      <section>
        <div class="section-heading">
          <h2>Trainingsfolge</h2>
          <span class="pill">A → B → A → B</span>
        </div>
        <div id="workout-list" class="workout-grid"></div>
      </section>
    </section>
  </main>

  <dialog id="workout-dialog">
    <div class="dialog-head">
      <div>
        <p class="eyebrow">TRAINING</p>
        <h2 id="dialog-title"></h2>
      </div>
      <button id="close-dialog" class="secondary">Schließen</button>
    </div>
    <div id="exercise-list" class="exercise-list"></div>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
